services:
  flavorithm:
    image: flavorithm:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flavorithm
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      FLAVORITHM_DB_PATH: /app/data/flavorithm.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - flavorithm-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/manifest.webmanifest').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      diun.enable: "false"

volumes:
  flavorithm-data:
