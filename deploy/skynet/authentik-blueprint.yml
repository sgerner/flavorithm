# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Flavorithm forward-auth application
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: Flavorithm
    attrs:
      name: Flavorithm
      mode: forward_single
      external_host: https://eat.stevengerner.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: flavorithm
    attrs:
      name: Flavorithm
      slug: flavorithm
      meta_launch_url: https://eat.stevengerner.com
      policy_engine_mode: any
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, Flavorithm]]

  # Preserve the host's existing embedded-outpost providers and add Flavorithm.
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, Alerts]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Audiobookshelf]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Bookward]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Hermes]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Hermes Dashboard]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Jellyseerr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Kavita]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Librarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Memory Hub]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Mindwtr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Navidrome]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Prowlarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Radarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, SABnzbd]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Sonarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Syncthing]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Uptime Kuma]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, qBittorrent]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Flavorithm]]
