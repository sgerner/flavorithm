services:
  flavorithm:
    ports: !reset []
    volumes:
      - /home/skynet/opt/appdata/flavorithm:/app/data
    environment:
      WHISPER_TRANSCRIPTION_URL: http://flavorithm-whisper:8080/inference
      WHISPER_MODEL: base
    networks:
      - proxy
      - voice

  flavorithm-whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main@sha256:a02c5bcd922e6d3c3372b23ab84f87a64756efb7cd547372f8033e91fdfbe822
    container_name: flavorithm-whisper
    restart: unless-stopped
    entrypoint: ['whisper-server']
    command:
      - --model
      - /models/ggml-base.bin
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --threads
      - '4'
      - --no-gpu
    user: '10001:10001'
    volumes:
      - /home/skynet/opt/appdata/flavorithm-whisper:/models:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 4
    mem_limit: 2g
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - voice
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
      diun.enable: 'false'

  flavorithm-updater:
    image: docker:29.10.0-cli@sha256:34507eb5069d8be82c95dd3b6987d4250fd5fee49b82e2509b7d7a7030740d6d
    container_name: flavorithm-updater
    restart: unless-stopped
    working_dir: /app
    command: ['/bin/sh', '/app/deploy/skynet/update.sh']
    environment:
      FLAVORITHM_UPDATE_INTERVAL_SECONDS: ${FLAVORITHM_UPDATE_INTERVAL_SECONDS:-900}
      FLAVORITHM_UPDATE_COMMAND_TIMEOUT_SECONDS: ${FLAVORITHM_UPDATE_COMMAND_TIMEOUT_SECONDS:-1800}
      FLAVORITHM_UPDATE_BRANCH: ${FLAVORITHM_UPDATE_BRANCH:-main}
      FLAVORITHM_UPDATE_REPO_URL: ${FLAVORITHM_UPDATE_REPO_URL:-https://github.com/sgerner/flavorithm.git}
      # Optional fine-grained token: read-only Checks and Actions permissions (plus Contents for private HTTPS forks).
      FLAVORITHM_GITHUB_TOKEN: ${FLAVORITHM_GITHUB_TOKEN:-}
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/skynet/opt/appdata/flavorithm-updater:/state
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
      diun.enable: 'false'

networks:
  proxy:
    external: true
  voice:
    name: flavorithm-voice
    internal: true
